# Registry of brand B2B portals to scrape.
#
# Each entry:
#   key:            short internal identifier, used in --brands filter and in CLI output
#   name:           display name written to the "brand" column in the CSV
#   portal_url:     login/landing URL for the brand's B2B site
#   scraper:        dotted path to the scraper class handling this brand
#   username_env:   name of the .env variable holding the login username/email
#   password_env:   name of the .env variable holding the login password
#   enabled:        set false to skip a brand without deleting its config
#
# To onboard a new brand: add an entry here, add its credentials to .env
# (see .env.example), and add a scraper module under src/kinetik_stock/scrapers/
# that implements BaseScraper (see scrapers/example_brand.py for a full example).

brands:
  # DEMO ENTRY: points at the local test fixture (tests/fixtures/example_b2b/),
  # not a real B2B portal. It exists so `python run.py` produces real output
  # out of the box, proving the login -> scrape -> CSV pipeline end-to-end.
  # Once you add your first real brand below, set this one's enabled to false
  # (or delete it).
  - key: example_brand
    name: "Example Brand"
    portal_url: "tests/fixtures/example_b2b/login.html"
    scraper: "kinetik_stock.scrapers.example_brand.ExampleBrandScraper"
    username_env: "EXAMPLE_BRAND_USERNAME"
    password_env: "EXAMPLE_BRAND_PASSWORD"
    enabled: true

  # Add real brands here, e.g.:
  # - key: acme_bikes
  #   name: "Acme Bikes"
  #   portal_url: "https://dealers.acmebikes.com/login"
  #   scraper: "kinetik_stock.scrapers.acme_bikes.AcmeBikesScraper"
  #   username_env: "ACME_BIKES_USERNAME"
  #   password_env: "ACME_BIKES_PASSWORD"
  #   enabled: true

  # Disabled until the login form / stock page selectors in
  # scrapers/transition_bikes.py are confirmed against the real portal
  # (this sandbox can't reach b2b.transitionbikes.com to inspect it directly).
  - key: transition_bikes
    name: "Transition Bikes"
    portal_url: "https://b2b.transitionbikes.com/Account"
    scraper: "kinetik_stock.scrapers.transition_bikes.TransitionBikesScraper"
    username_env: "TRANSITION_BIKES_USERNAME"
    password_env: "TRANSITION_BIKES_PASSWORD"
    enabled: false

  # PLACEHOLDER - scrapers/santa_cruz.py both raises NotImplementedError;
  # no real dealer-portal HTML/network captures have been seen yet (this
  # sandbox has no network access to inspect it directly). portal_url below
  # is a guess, not confirmed. Disabled until the user pastes real captures
  # (login page HTML, field names, stock page structure) to derive the real
  # selectors from, same workflow used for devinci.py/transition_bikes.py.
  - key: santa_cruz
    name: "Santa Cruz Bicycles"
    portal_url: "https://dealer.santacruzbicycles.com/"
    scraper: "kinetik_stock.scrapers.santa_cruz.SantaCruzScraper"
    username_env: "SANTA_CRUZ_USERNAME"
    password_env: "SANTA_CRUZ_PASSWORD"
    enabled: false

  # Confirmed working end-to-end by the user against a real live login and
  # scrape (this sandbox itself still can't reach transac.devinci.com to
  # verify anything directly - network policy). Four real bugs surfaced
  # and got fixed across several live-test rounds (see scrapers/devinci.py):
  # fetch_stock() only scraped the In Season grid, missing SKUs that only
  # exist in Closeout; build_availability_report() matched by SKU alone
  # instead of (SKU, size), producing hundreds of duplicate rows;
  # PRE_ORDER items' ETA used a single page-wide "future production" start
  # date instead of each size's own real production schedule (fixed by
  # fetching Achats_Cedule.aspx per (SKU, size), the same request the real
  # page makes on hover, and reporting the closest of its possibly-multiple
  # dates); and that fetch initially crashed the whole run with a
  # UnicodeDecodeError because Playwright's response.text() assumes UTF-8
  # but that endpoint's response is actually Windows-1252-encoded.
  # The grid's own row/cell parsing IS confirmed against real portal HTML
  # for both order types the user has captured (In Season, Closeout) -
  # _extract_stock_items_from_page(), tested against
  # tests/fixtures/devinci_product/achats_treeview.html and
  # achats_treeview_closeout.html. Two more order types are known to exist
  # from the real Menu.aspx (Parts, Rental Orders) but their own grid HTML
  # hasn't been captured, so it's not confirmed they share the same
  # RadGrid1 layout, and fetch_stock() doesn't scrape them.
  - key: devinci
    name: "Devinci"
    portal_url: "https://transac.devinci.com/"
    scraper: "kinetik_stock.scrapers.devinci.DevinciScraper"
    username_env: "DEVINCI_USERNAME"
    password_env: "DEVINCI_PASSWORD"
    enabled: true

  # Confirmed working end-to-end against a real live login (search ->
  # click-through -> product page -> stock/status/ETA extraction), including
  # the "10+" display cap. See norco_report.py for its own report format.
  - key: norco
    name: "Norco"
    portal_url: "https://ltpdealer.com/"
    scraper: "kinetik_stock.scrapers.norco.NorcoScraper"
    username_env: "NORCO_USERNAME"
    password_env: "NORCO_PASSWORD"
    extra_env:
      dealer_id: "NORCO_DEALER_ID"
    enabled: true
