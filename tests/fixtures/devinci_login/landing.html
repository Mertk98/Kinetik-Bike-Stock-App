the second "IN SEASON(closed)" link below (a distinct, non-navigating

WebForm_DoPostBackWithOptions(...), both functions the real ASP.NET/
Telerik runtime provides (via WebResource.axd scripts not included here).
The stand-in implementations of them below are NOT part of the real page -
they exist only so this fixture can be clicked through to a destination
page, the same idea as tests/fixtures/example_b2b/login.html.
It always navigates to the devinci_product fixture (a stand-in for whatever
real Achats_Treeview.aspx grid the click would normally reach), regardless
of which real actionUrl was passed in - fetch_stock()'s tests only need to
confirm the click lands somewhere with the confirmed grid's own fields.
-->
