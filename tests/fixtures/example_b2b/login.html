<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Example Brand B2B Login</title></head>
<body>
  <h1>Dealer Portal Login</h1>
  <form id="login-form">
    <input type="text" id="username" name="username" placeholder="Username">
    <input type="password" id="password" name="password" placeholder="Password">
    <button type="submit" id="login-button">Log in</button>
  </form>
  <p id="error" style="color:red; display:none;">Invalid credentials</p>

  <script>
    // Stand-in for a real backend: this fixture exists only so the scraper
    // framework can be exercised end-to-end without live B2B credentials.
    const VALID_USERNAME = "demo_user";
    const VALID_PASSWORD = "demo_pass";

    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      if (username === VALID_USERNAME && password === VALID_PASSWORD) {
        window.location.href = "stock.html?authed=1";
      } else {
        document.getElementById("error").style.display = "block";
      }
    });
  </script>
</body>
</html>
