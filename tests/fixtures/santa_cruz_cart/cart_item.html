<!--

cart) after a successful "Add to cart", pasted by the user. Kept verbatim:
the ".cx-item-list-row" row, the ".cx-name h4"/".cx-code" shared sub-
components (same shape as the Quick Order table's rows), and the
".schedule-line-wrapper .value" "Est. shipment date" text - a date RANGE
("<qty> by <start MM-DD-YYYY> - <end MM-DD-YYYY>"), rendered twice here
(a mobile and a desktop copy of the same data), not a single date.
-->
<html><head><meta charset="utf-8"></head>
<body>
<div class="cx-item-list-row">
  <scb-cart-page-item>
    <div class="cx-info-container">
      <div class="cx-name"><a class="cx-link" href="/product/58-26313-454-3-905-262901"><h4>Bronson 5 C</h4></a></div>
      <div class="cx-code"> Brsn 5 C MX 26 MD GRN 90 </div>
      <div class="cx-code"> SKU: 58-26313-454-3-905-262901 </div>
    </div>
    <div class="availability-container">
      <div class="header"> Est. shipment date </div>
      <div class="schedule-line-wrapper"><div class="value"><span class="bolded-qty">1</span> by 10-05-2026 - 10-12-2026</div></div>
      <div class="header"> Est. shipment date </div>
      <div class="schedule-line-wrapper"><div class="value"><span class="bolded-qty">1</span> by 10-05-2026 - 10-12-2026</div></div>
    </div>
  </scb-cart-page-item>
</div>
<scb-clear-cart><div class="button-link-wrapper"><button class="link cx-action-link"> Clear cart </button></div></scb-clear-cart>
</body></html>
